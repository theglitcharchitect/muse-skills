<line x1="700" y1="310" x2="560" y2="400" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="430.0" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400">Jev advises. The human authorizes. Shadow mode first, always.</text>
